[workspace]
resolver = "3"
members  = [
    "crates/lmx",
    "crates/lmx-facts",
    "crates/lmx-ipc",
    "crates/lmx-model",
    "crates/lmxd"
]

[workspace.package]
version      = "0.3.0"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"
repository   = "https://github.com/limanix/lmx"
homepage     = "https://limanix.dev"

[workspace.dependencies]
lmx-facts           = { path = "crates/lmx-facts" }
lmx-ipc             = { path = "crates/lmx-ipc" }
lmx-model           = { path = "crates/lmx-model" }
lmxd                = { path = "crates/lmxd" }
base64              = "0.23.1"
clap                = { version = "4.6.7", features = ["derive"] }
hyper-util          = { version = "0.1.21", features = ["tokio"] }
listenfd            = "1.0.2"
prost               = "0.14.4"
protoc-bin-vendored = "3.3.0"
rustix              = { version = "1.1.6", features = ["fs", "system"] }
sd-notify           = "0.5.0"
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.154"
solti               = { version = "0.0.8", default-features = false }
tempfile            = "3.27.0"
thiserror           = "2.0.21"
tokio               = "1.54.1"
tokio-stream        = { version = "0.1.19", features = ["net"] }
tonic               = "0.14.8"
tonic-prost         = "0.14.8"
tonic-prost-build   = "0.14.8"
tower               = { version = "0.5.3", features = ["util"] }
tracing             = "0.1.44"
unicode-width       = "0.2.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
unsafe_code                   = "forbid"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

[profile.release]
codegen-units = 1

lto   = true
strip = true
