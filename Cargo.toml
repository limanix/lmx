[workspace]
resolver = "3"
members  = ["crates/lmx", "crates/lmx-facts", "crates/lmx-ipc", "crates/lmx-model", "crates/lmxd"]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"
repository   = "https://github.com/limanix/lmx"
homepage     = "https://limanix.dev"

[workspace.dependencies]
lmx-facts           = { path = "crates/lmx-facts" }
lmx-ipc             = { path = "crates/lmx-ipc" }
lmx-model           = { path = "crates/lmx-model" }
lmxd                = { path = "crates/lmxd" }
base64              = "0.23.1"
clap                = { version = "4.6.6", features = ["derive"] }
hyper-util          = { version = "0.1.20", features = ["tokio"] }
listenfd            = "1.0.2"
prost               = "0.14.4"
protoc-bin-vendored = "3.2.0"
rustix              = { version = "1.1.4", features = ["fs", "system"] }
sd-notify           = "0.4.5"
serde               = { version = "1.0.229", features = ["derive"] }
serde_json          = "1.0.151"
solti               = { version = "0.0.8", default-features = false }
tempfile            = "3.27.0"
thiserror           = "2.0.20"
tokio               = "1.53.1"
tokio-stream        = { version = "0.1.19", features = ["net"] }
tonic               = "0.14.6"
tonic-prost         = "0.14.6"
tonic-prost-build   = "0.14.6"
tower               = { version = "0.5.3", features = ["util"] }
tracing             = "0.1.44"
unicode-width       = "0.2.2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
unsafe_code                   = "forbid"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

# Panics unwind: lmxd relies on Taskvisor catching task panics, and Cargo cannot set `panic` per package.
[profile.release]
codegen-units = 1
lto           = true
strip         = true
