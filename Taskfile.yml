# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  rust:
    # v0.0.5
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/81255f635d839a2b46417720676cd2bebfc10cff/taskfiles/rust/Taskfile.yml
    internal: true
  python:
    # v0.0.5
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/81255f635d839a2b46417720676cd2bebfc10cff/taskfiles/python/Taskfile.yml
    internal: true
  markdown:
    # v0.0.5
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/81255f635d839a2b46417720676cd2bebfc10cff/taskfiles/markdown/Taskfile.yml
    internal: true

vars:
  markdown_paths: README.md guides
  version:
    sh: sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1

tasks:
  ci/rust/fmt:
    desc: Check Rust formatting
    cmds:
      - task: rust:fmt
        vars: { FMT_ARGS: '--all --check' }

  ci/rust/clippy:
    desc: Run Rust Clippy
    cmds:
      - task: rust:clippy
        vars: { CLIPPY_ARGS: '--workspace --all-targets --locked -- -D warnings' }

  ci/rust/test:
    desc: Run Rust tests
    cmds:
      - task: rust:test
        vars: { TEST_ARGS: '--workspace --locked' }

  ci/rust/docs/check:
    desc: Run Rust docs checks
    cmds:
      - task: rust:doc/build
        vars: { DOC_ARGS: '--workspace --no-deps --document-private-items --locked' }

  ci/rust/audit:
    desc: Run Rust audit
    cmds:
      - task: rust:audit

  ci/markdown/fmt:
    desc: Check Markdown formatting
    cmds:
      - task: markdown:fmt
        vars:
          FMT_PATHS: '{{.markdown_paths}}'
          TASK_CONTEXT:
            ref: 'merge (dict) (dict "CONTAINER_MOUNT_MODE" "ro") (.TASK_CONTEXT | default .)'

  rust/fmt/fix:
    desc: Fix format Rust sources
    cmds:
      - task: rust:fmt/fix
        vars: { FMT_ARGS: '--all' }

  markdown/fix:
    desc: Fix format Markdown sources
    cmds:
      - task: markdown:fmt/fix
        vars:
          FMT_PATHS: '{{.markdown_paths}}'

  docs/prepare:
    desc: Prepare LimaNix site docs
    vars:
      lmx_ref:
        sh: |
          {{if .LMX_REF}}
          printf '%s\n' {{.LMX_REF | shellQuote}}
          {{else}}
          git -C {{.ROOT_DIR | shellQuote}} rev-parse HEAD
          {{end}}
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: python scripts/build_docs.py --ref {{.lmx_ref | shellQuote}}

  release/build:
    desc: Build binary
    requires:
      vars:
        - name: ARCH
          enum: [aarch64, x86_64]
    vars:
      ARCH: '{{.ARCH | default (ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64")}}'
    cmds:
      - task: rust:_cargo/tool
        vars:
          RUSTFLAGS: -D warnings
          CMD: sh scripts/release-archive.sh {{.version}} {{.ARCH}}
