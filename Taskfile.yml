# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  rust:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/rust/Taskfile.yml
    internal: true
  markdown:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/markdown/Taskfile.yml
    internal: true

vars:
  markdown_paths: README.md contract/README.md
  version:
    sh: sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -n 1

tasks:
  ci/rust/fmt:
    desc: Check Rust formatting
    cmds:
      - task: rust:fmt

  ci/rust/lint:
    desc: Run Rust Clippy
    cmds:
      - task: rust:lint
        vars: { LINT_ARGS: '--workspace --all-targets --locked -- -D warnings' }

  ci/rust/test:
    desc: Run Rust tests
    cmds:
      - task: rust:test
        vars: { TEST_ARGS: '--workspace --locked' }

  ci/rust/docs:
    desc: Run Rust docs checks
    cmds:
      - task: rust:docs
        vars: { DOCS_ARGS: '--workspace --no-deps --document-private-items --locked' }

  ci/rust/audit:
    desc: Run Rust audit
    cmds:
      - task: rust:audit

  ci/markdown/fmt:
    desc: Check Markdown formatting
    cmds:
      - task: markdown:fmt
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  rust/fmt/fix:
    desc: Fix format Rust sources
    cmds:
      - task: rust:fmt/fix

  markdown/fix:
    desc: Fix format Markdown sources
    cmds:
      - task: markdown:fmt/fix
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  release/build:
    desc: Build binary
    requires:
      vars:
        - name: ARCH
          enum: [aarch64, x86_64]
    vars:
      ARCH: '{{.ARCH | default (ARCH | replace "arm64" "aarch64" | replace "amd64" "x86_64")}}'
    cmds:
      - task: rust:exec
        vars:
          RUSTFLAGS: -D warnings
          CMD: sh scripts/release-archive.sh {{.version}} {{.ARCH}}
