name: Labels flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  check-label:
    name: check label
    runs-on: ubuntu-24.04
    steps:
      - uses: mr-chelyshkin/actions/changelog-label-check@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          allowed-labels: |
            feature
            bug
            docs
            deps
            tooling
            other
            skip
