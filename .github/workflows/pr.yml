name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/task-run@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          task: ci/markdown/fmt

  rust:
    needs: [markdown]
    uses: mr-chelyshkin/actions/.github/workflows/ci-rust.yml@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
    permissions:
      contents: read
    with:
      cache-key-prefix: lmx-rust-v1
      cache-dependency-path: |
        Cargo.lock
        Cargo.toml
        rust-toolchain.toml

  release:
    name: Release build (${{ matrix.arch }})
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo registry and build results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/rust
          key: lmx-rust-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            lmx-rust-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
            lmx-rust-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.arch }}-
      - name: Build the release archive
        uses: mr-chelyshkin/actions/task-run@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          task: release/build
          args: ARCH=${{ matrix.arch }}

  gate:
    if: always()
    needs: [markdown, rust, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/job-results-check@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          results: ${{ toJSON(needs) }}
